[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer-core"
version = "0.1.0"
description = "Offline document anonymization core and CLI"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "python-docx>=1.1.2",
  "pymupdf>=1.24.0",
]

[project.scripts]
anonymizer = "anonymizer_core.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["anonymizer_core*"]
