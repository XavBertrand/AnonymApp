[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymizer-standalone"
version = "0.1.0"
description = "Standalone offline document anonymizer"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "anonymizer-core",
  "anonymizer-app",
  "pytest>=8.0",
]

[tool.uv.sources]
anonymizer-core = { path = "packages/anonymizer_core", editable = true }
anonymizer-app = { path = "packages/anonymizer_app", editable = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
  "acceptance: acceptance-level checks",
]
