[project]
name = "anonymapp"
version = "0.1.0"
description = "Windows-first local anonymization MVP scaffolding"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "transformers>=4.41.0",
  "torch>=2.2.0",
  "requests>=2.31.0",
  "rapidfuzz>=3.9.0",
  "Unidecode>=1.3.8",
  "gliner>=0.2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.anonymapp.environment]
notes = "Use a lockfile strategy (uv.lock or pip-tools generated lock) for reproducible local MVP setup. End users are not expected to manage Python manually in long-term packaging."
windows_compatible = true
supports_tmp_scripts = true
